# ============================================================================
#  SSMS on Cloudflare - configuration file for Wrangler (ตัวอย่าง)
# ============================================================================
#
#  ไฟล์นี้ใช้**เฉพาะ**วิธีติดตั้งแบบใช้ Wrangler จากบรรทัดคำสั่ง (หัวข้อ 4 ของคู่มือ)
#
#  ถ้าคุณติดตั้งผ่าน Git integration (หัวข้อ 3 - แนะนำสำหรับมือใหม่)
#  **ไม่ต้องใช้ไฟล์นี้เลย** เพราะ Cloudflare จะ compile โฟลเดอร์ functions/
#  ให้เอง และผูกฐานข้อมูลผ่านหน้า Settings ในหน้าเว็บ
#
#  วิธีใช้:
#    1. คัดลอกไฟล์นี้เป็น wrangler.toml ที่รากโปรเจกต์
#       (copy docs\wrangler.example.toml wrangler.toml)
#    2. แก้ database_id ให้เป็นรหัสจริงของฐานข้อมูล D1 ของคุณ
#       (ดูได้จากคำสั่ง: npx wrangler d1 list)
#    3. npx wrangler pages deploy public
# ============================================================================

name = "ssms"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
#  ฐานข้อมูล D1
# ---------------------------------------------------------------------------
#  ชื่อ binding ต้องเป็น "DB" เป๊ะ ๆ เพราะโค้ดอ่านจาก env.DB
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ssms"
database_id = "เปลี่ยนเป็น-database-id-ของคุณ"

# ---------------------------------------------------------------------------
#  ตัวแปรแวดล้อม
# ---------------------------------------------------------------------------
#  IMPORT_KEY คือคีย์สำหรับนำเข้าข้อมูลเก่า - ควรเปลี่ยนค่านี้ก่อนใช้งานจริง
#  (หรือใช้คำสั่ง: npx wrangler pages secret put IMPORT_KEY)
# ---------------------------------------------------------------------------
[vars]
IMPORT_KEY = "SSMS-IMPORT-KEY-2026"
