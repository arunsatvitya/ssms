# ============================================================================
#  SSMS on Cloudflare - configuration file for Wrangler
# ============================================================================
#
#  ไฟล์นี้ใช้กับเครื่องมือ wrangler (คำสั่ง npx wrangler ...)
#  คนที่ติดตั้งผ่านหน้าเว็บ Cloudflare ไม่ต้องแก้ไฟล์นี้
#  (แต่ต้องรู้ชื่อตัวแปรที่ต้องตั้งในหน้าตั้งค่าโปรเจกต์)
# ============================================================================

name = "ssms"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
#  ฐานข้อมูล D1
# ---------------------------------------------------------------------------
#  ต้องแก้ database_id ให้เป็นรหัสของฐานข้อมูลที่คุณสร้าง
#  (ดูได้จากคำสั่ง: npx wrangler d1 list)
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ssms"
database_id = "เปลี่ยนเป็น-database-id-ของคุณ"

# ---------------------------------------------------------------------------
#  ตัวแปรแวดล้อม
# ---------------------------------------------------------------------------
#  IMPORT_KEY คือคีย์สำหรับนำเข้าข้อมูลเก่า - ควรเปลี่ยนค่านี้ก่อนใช้งานจริง
#  ตั้งค่าได้ที่: Pages > โปรเจกต์ > Settings > Environment variables
# ---------------------------------------------------------------------------
[vars]
IMPORT_KEY = "SSMS-IMPORT-KEY-2026"
